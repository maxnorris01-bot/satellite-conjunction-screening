# Eval gates. Change only in dedicated commits, never alongside the change they'd excuse.
#
# The screening pipeline is deterministic (frozen inputs, no LLM calls), so every case must pass: a
# failing case is a bug, not noise. The template's 0.90 was sized for LLM run-to-run variance and
# would let one broken case in ten through. See docs/adr/adr-0008-screening-evals-oracle-and-named-cases.md.
min_pass_rate: 1.0
# Per-case pipeline wall-clock (not the oracle's). The frozen default-scope snapshot takes ~1.3 s on
# an Apple Silicon Mac and ~5 s on the Intel i5 behind ADR 0007's numbers; 30 s leaves headroom
# for slow CI runners while still catching an order-of-magnitude regression.
max_latency_p95_s: 30.0
# No LLM calls, so cost is always $0. Kept so that a future LLM step's spend is gated from day one.
max_mean_cost_usd: 0.10
max_total_cost_usd: 5.00
