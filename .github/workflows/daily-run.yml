# Daily screening run (ADR 0012): start the existing Fly Machine once a day, wait for it to finish,
# and fail loudly unless it exited 0 and the bucket's history index was rewritten by this run.
# Replaces Fly's built-in `schedule: daily`, which proved unreliable (see ADR 0012).
#
# A red run is the alert: GitHub emails the repo owner when a workflow fails. The only secret is
# FLY_API_TOKEN (a Fly token scoped to this app), passed only to the steps that call flyctl.
# flyctl reads it from the environment, so it never appears in a command line or in the log.
name: daily-run

on:
  schedule:
    # 10:17 UTC (03:17 PDT / 02:17 PST). CelesTrak publishes no fixed update times: it checks for
    # new GP data every 2 hours and allows one download per GROUP per update (a repeat gets a 403),
    # so the time can't be keyed to an update. What matters is staying clear of other downloads
    # of the same groups: manual runs happen during US Pacific working hours, and this is the
    # middle of the Pacific night. It's also far from 00:00 UTC, so GitHub's usual scheduling
    # delays can't push a run onto the wrong UTC date (snapshots are keyed by date, ADR 0011).
    # Minute 17 avoids the top-of-hour load where GitHub most often delays or drops cron runs.
    - cron: "17 10 * * *"
  workflow_dispatch:

# One run at a time: a manual dispatch overlapping the scheduled run would double-download and
# hit CelesTrak's per-update limit.
concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_APP: satellite-conjunction-screening
  FLY_MACHINE_ID: 1850e47cdd43e8
  INDEX_URL: https://satellite-conjunction-screening.fly.storage.tigris.dev/history/index.json
  # CelesTrak allows one download per GROUP per 2-hour update window.
  COOLDOWN_S: "7200"

jobs:
  run:
    runs-on: ubuntu-latest
    # Pipeline is ~110 s on Fly; the wait polls for up to 15 min to cover a slow boot or the
    # unexplained 560 s first run seen once locally (working notes' open items).
    timeout-minutes: 25
    # FLY_API_TOKEN is set only on the three steps that call flyctl (start, wait, exit-code check),
    # not at job level, so the checkout, the third-party setup-flyctl action and the curl steps
    # never see it.
    steps:
      # First, before any step writes files: checkout cleans the workspace. Only the wait script
      # is needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          # Nothing here pushes or fetches again, so don't leave the job's GITHUB_TOKEN in
          # .git/config for later steps.
          persist-credentials: false

      # Pinned to a commit, not a branch. No release fits: the latest, v1.5 (fc53c09, 2024-02-02),
      # still runs on node20, and upstream moved the action to node24 only on master, unreleased.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08 (unreleased; after v1.5, node24)
        with:
          version: 0.4.111

      - name: Check CelesTrak cooldown
        run: |
          set -euo pipefail
          index=$(curl -fsS -H 'Cache-Control: no-cache' "$INDEX_URL?t=$(date +%s)")
          last=$(jq -r '.generated_at_utc' <<<"$index")
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "Last publish: $last (${age}s ago)"
          if [ "$age" -lt "$COOLDOWN_S" ]; then
            echo "::error title=CelesTrak cooldown::The last run published ${age}s ago ($last). CelesTrak allows one download per group per 2-hour update, so starting now would fail with HTTP 403. This is the cooldown, not an outage: re-run this workflow after $(date -u -d "@$(( $(date -u -d "$last" +%s) + COOLDOWN_S ))" +%H:%MZ)."
            exit 1
          fi

      - name: Start the Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          date -u +%s%3N > start_ms
          date -u +%Y-%m-%dT%H:%M:%SZ > start_iso
          flyctl machine start "$FLY_MACHINE_ID" -a "$FLY_APP"

      # Not `flyctl machine wait`: each wait request is capped at 60 s client-side and flyctl doesn't
      # retry the deadline_exceeded, so it gave up after 60 s on the first real run (ADR 0012).
      - name: Wait for it to stop
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: START_MS=$(cat start_ms) DEADLINE_S=900 .github/scripts/wait-for-machine.sh

      - name: Check exit code
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          start_ms=$(cat start_ms)
          # exit_code is omitted from the JSON when it's 0 (omitempty), so a present exit event
          # with no code means success.
          code=$(flyctl machine list -a "$FLY_APP" --json | jq -r --arg id "$FLY_MACHINE_ID" --argjson t "$start_ms" '
            [.[] | select(.id == $id) | .events[]? | select(.type == "exit" and .timestamp >= $t)]
            | sort_by(.timestamp) | last
            | if . == null then "none"
              else (.request.exit_event.exit_code // .request.monitor_event.exit_event.exit_code // 0 | tostring)
              end')
          echo "$code" > exit_code
          echo "Machine exit code: $code"
          if [ "$code" = "none" ]; then
            echo "::error title=No exit event::The Machine stopped but reported no exit event after this run started; check fly logs -a $FLY_APP."
            exit 1
          fi
          if [ "$code" != "0" ]; then
            if flyctl logs -a "$FLY_APP" --no-tail 2>/dev/null | grep '"event": "failed"' | tail -1 | grep -q -E '403|has not updated since your last successful download'; then
              echo "::error title=CelesTrak cooldown (403)::The run failed with HTTP 403 from CelesTrak, which allows one download per group per 2-hour update. Another download of the same groups happened within the last 2 hours (usually a manual run). This is the cooldown, not an outage: re-run this workflow 2 hours after that download."
            else
              echo "::error title=Run failed::The Machine exited with code $code. See fly logs -a $FLY_APP for the run's one-line failure JSON."
            fi
            exit 1
          fi

      - name: Verify the bucket was updated by this run
        run: |
          set -euo pipefail
          index=$(curl -fsS -H 'Cache-Control: no-cache' "$INDEX_URL?t=$(date +%s)")
          generated=$(jq -r '.generated_at_utc' <<<"$index")
          start_iso=$(cat start_iso)
          echo "history/index.json generated_at_utc: $generated (run started $start_iso)"
          if [ "$(date -u -d "$generated" +%s)" -lt "$(date -u -d "$start_iso" +%s)" ]; then
            echo "::error title=Stale history index::The Machine exited 0 but history/index.json is from $generated, before this run started ($start_iso). The publish may have failed after the pipeline, or the retention step logged a retention_error."
            exit 1
          fi
          {
            echo "### Daily run published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Run id | \`$(jq -r '.latest_run_id' <<<"$index")\` |"
            echo "| Machine exit code | $(cat exit_code) |"
            echo "| Snapshot date | $(jq -r '.dates[0].date' <<<"$index") |"
            echo "| Dates retained | $(jq -r '[.dates[].date] | join(", ")' <<<"$index") |"
            echo "| Index generated | $generated |"
          } >> "$GITHUB_STEP_SUMMARY"
