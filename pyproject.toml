[project]
name = "app"
version = "0.1.0"
description = "PROJECT_NAME"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "sgp4>=2.27",
    "spacetrack>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
# 3.12, not 3.11: the locked numpy (2.5.x, resolved for 3.12+) ships stubs using 3.12-only syntax,
# so checking against 3.11 fails inside numpy itself rather than in project code.
python_version = "3.12"
strict = true
files = ["src", "evals"]

# Neither ships type information (no py.typed, no stubs bundled).
[[tool.mypy.overrides]]
module = ["sgp4.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
